name: Check Extension

on:
  push:
    branches:
      - master
    paths:
      - src/vsstubs-vscode/**
      - .github/workflows/vscode-check.yml
  pull_request:
    paths:
      - src/vsstubs-vscode/**
      - .github/workflows/vscode-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          working-directory: src/vsstubs-vscode
          cache: true

      - name: Lint and Type Check
        working-directory: src/vsstubs-vscode
        run: vpr compile
