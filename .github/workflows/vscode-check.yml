name: Check Extension

on:
  push:
    branches:
      - master
    paths:
      - src/vsstubs-vscode/**
      - .github/workflows/vscode-check.yml
  pull_request:
    paths:
      - src/vsstubs-vscode/**
      - .github/workflows/vscode-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "24"
          working-directory: src/vsstubs-vscode
          cache: true

      - name: Lint and Type Check
        working-directory: src/vsstubs-vscode
        run: vp run compile
